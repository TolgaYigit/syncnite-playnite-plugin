name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # windows-latest, not ubuntu, to match what this plugin actually runs on (Playnite is
    # Windows-only) - the reference-assemblies package lets net462 build cross-platform, but
    # running the real test target on the real OS beats trusting that never matters.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run tests
        run: dotnet test PlayniteCloudSync.Tests/PlayniteCloudSync.Tests.csproj --configuration Release
