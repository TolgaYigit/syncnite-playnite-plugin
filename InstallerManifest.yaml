    PackageUrl: https://github.com/TolgaYigit/syncnite-playnite-plugin/releases/download/v0.3.1/Syncnite_0_3_1.pext
    Changelog:
      - Removed the API base URL field from settings - it's fixed now, no reason for users to see or edit it
